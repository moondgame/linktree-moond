<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Saya</title>

  <!-- Proteksi dasar: cegah situs ini di-embed di iframe orang lain (anti clickjacking) -->
  <meta http-equiv="X-Frame-Options" content="DENY">
  <!-- Batasi resource yang boleh dimuat halaman ini -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';">
  <!-- Jangan kirim info halaman asal saat orang klik link keluar -->
  <meta name="referrer" content="no-referrer-when-downgrade">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(160deg, #05010a 0%, #1a0508 35%, #2b0714 55%, #0a0a2e 80%, #050015 100%);
      color: #fff;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ff2d55;
      margin-bottom: 15px;
      object-fit: cover;
      box-shadow: 0 0 18px #ff2d55, 0 0 30px rgba(59, 91, 219, 0.4);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
      background: linear-gradient(90deg, #ff2d55, #a742f5, #3b5bdb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
    }

    p {
      font-size: 14px;
      margin-bottom: 25px;
      color: #ccc;
    }

    .link, .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 45, 85, 0.25);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      padding: 15px;
      margin: 12px 0;
      font-size: 18px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 45, 85, 0.25), inset 0 0 10px rgba(59, 91, 219, 0.1);
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      font-family: inherit;
    }

    .link:hover, .link-btn:hover {
      background: linear-gradient(90deg, rgba(255, 45, 85, 0.25), rgba(59, 91, 219, 0.25));
      border-color: #ff2d55;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 45, 85, 0.6), 0 0 15px rgba(59, 91, 219, 0.5);
    }

    /* Panel submenu */
    .panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.35s ease;
      margin: 0;
    }

    .panel.open {
      max-height: 500px;
      opacity: 1;
      margin: 4px 0 12px 0;
    }

    .panel .link {
      font-size: 16px;
      padding: 12px;
      margin: 8px 0;
    }

    .back-btn {
      background: transparent;
      box-shadow: none;
      color: #ff2d55;
      font-size: 14px;
      padding: 8px;
    }

    .back-btn:hover {
      background: rgba(255, 45, 85, 0.1);
      transform: none;
      box-shadow: none;
    }

    .chevron {
      margin-left: auto;
      transition: transform 0.3s ease;
      font-size: 14px;
    }

    .link-btn.active .chevron {
      transform: rotate(180deg);
    }

    .social-icons {
      margin-top: 20px;
    }

    .social-icons a {
      color: #5b7cfa;
      font-size: 22px;
      margin: 0 10px;
      transition: 0.3s;
    }

    .social-icons a:hover {
      color: #ff2d55;
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://i.ibb.co.com/8LFVyBCv/IMG-20260327-WA0044.jpg" alt="Foto Profil" class="profile-img">
    <h1>MOOND</h1>
    <p>Semua link ada di sini!</p>

    <!-- Tombol utama -->
    <a href="https://saweria.co/Moondgame" class="link" target="_blank" rel="noopener noreferrer">
      <i class="fas fa-hand-holding-dollar"></i> Donasi Saweria
    </a>

    <button class="link-btn" id="btn-sosmed" onclick="togglePanel('sosmed')">
      <i class="fas fa-share-nodes"></i> Sosial Media <i class="fas fa-chevron-down chevron"></i>
    </button>
    <div class="panel" id="panel-sosmed">
      <a href="https://discord.gg/JjU2mXhcq" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-discord"></i> Discord</a>
      <a href="https://youtube.com/@moon_d-v3t?si=QsRbEjRRboqyiG1s" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i> YouTube</a>
      <a href="https://instagram.com/plaayer_499" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i> Instagram</a>
      <a href="https://twitter.com/moond499" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-twitter"></i> Twitter</a>
      <a href="https://tiktok.com/@n0_m00nd_499" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i> TikTok</a>
      <a href="https://github.com/moondgame" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://whatsapp.com/channel/0029VbDj1M91SWswUQegNu0q" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i> Saluran WhatsApp</a>
      <a href="https://chat.whatsapp.com/D9xbjDXhOMH1kQyBLfcf4h" class="link" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i> Komunitas WhatsApp</a>
    </div>

    <button class="link-btn" id="btn-game" onclick="togglePanel('game')">
      <i class="fas fa-gamepad"></i> Game <i class="fas fa-chevron-down chevron"></i>
    </button>
    <div class="panel" id="panel-game">
      <a href="https://www.roblox.com/users/8766906281/profile" class="link" target="_blank" rel="noopener noreferrer"><i class="fas fa-gamepad"></i> Roblox</a>
    </div>
  </div>

  <script>
    function togglePanel(name) {
      const panel = document.getElementById('panel-' + name);
      const btn = document.getElementById('btn-' + name);
      const isOpen = panel.classList.contains('open');

      // Tutup semua panel lain
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.link-btn').forEach(b => b.classList.remove('active'));

      // Buka panel yang diklik jika sebelumnya tertutup
      if (!isOpen) {
        panel.classList.add('open');
        btn.classList.add('active');
      }
    }
  </script>
</body>
</html>
