  <!-- ===================== PROTEKSI DASAR ===================== -->
  <!-- Cegah situs ini di-embed di iframe orang lain (anti clickjacking) -->
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!--
    Content-Security-Policy (diperketat):
    - default-src 'self'      -> semua resource default hanya boleh dari domain sendiri
    - script-src 'self'       -> TIDAK ADA 'unsafe-inline'. Semua JS harus dari file script.js.
                                  Kalau ada yang menyuntikkan <script>...</script> langsung
                                  ke HTML (mis. lewat XSS), browser akan MENOLAK menjalankannya.
    - style-src 'self'        -> TIDAK ADA 'unsafe-inline'. Semua CSS dari style.css.
                                  Font Awesome sekarang di-hosting sendiri di /assets, bukan CDN,
                                  jadi tidak perlu izinkan domain CDN eksternal sama sekali.
    - font-src 'self'         -> font hanya dari /assets/webfonts milik sendiri
    - img-src 'self' https://i.ibb.co.com data:
                                  -> hanya izinkan domain foto profil yang memang dipakai,
                                     bukan img-src * (yang tadinya mengizinkan gambar dari domain manapun)
    - object-src 'none'       -> blokir plugin lama (Flash dll) yang sering jadi celah
    - base-uri 'self'         -> cegah penyisipan <base> jahat yang bisa membajak semua link relatif
    - form-action 'self'      -> kalau suatu saat ada form, hasil submit tidak bisa dialihkan ke situs lain
    - frame-ancestors 'none'  -> lapisan kedua anti-iframe/clickjacking (redundan dgn X-Frame-Options)
    - upgrade-insecure-requests -> paksa semua request pakai HTTPS
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://i.ibb.co.com data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;">

  <!-- Jangan kirim info halaman asal saat orang klik link keluar -->
  <meta name="referrer" content="no-referrer-when-downgrade">
  <!-- Cegah browser lama "menebak" tipe file (mitigasi MIME-sniffing attack) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
